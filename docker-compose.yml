services:
  db:
    image: postgres:15-alpine
    container_name: insidehubv2_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgadmin12345
      POSTGRES_DB: insidehubv2_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: insidehubv2_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: insidehubv2_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: insidehubv2_app
    environment:
      DATABASE_URL: postgresql://postgres:pgadmin12345@db:5432/insidehubv2_db
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: dev
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://db:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build: .
    container_name: insidehubv2_celery_worker
    environment:
      DATABASE_URL: postgresql://postgres:pgadmin12345@db:5432/insidehubv2_db
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - .:/app
    command: celery -A app.celery_app worker -l info -c 4

  celery_beat:
    build: .
    container_name: insidehubv2_celery_beat
    environment:
      DATABASE_URL: postgresql://postgres:pgadmin12345@db:5432/insidehubv2_db
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      - db
      - redis
      - rabbitmq
      - celery_worker
    volumes:
      - .:/app
    command: celery -A app.celery_app beat -l info

  flower:
    build: .
    container_name: insidehubv2_flower
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
      - redis
      - celery_worker
    command: celery -A app.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  app_data:
  flower_data:
  celery_worker_data:
  celery_beat_data:
